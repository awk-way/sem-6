<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Depression Expert System for IT Employees</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 900px;
      margin: 30px auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      color: #2c3e50;
    }

    p.description {
      text-align: center;
      color: #555;
      margin-bottom: 30px;
    }

    .question {
      margin-bottom: 20px;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fafafa;
    }

    .question h3 {
      margin: 0 0 10px;
      font-size: 17px;
    }

    select {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      background: #3498db;
      color: white;
      cursor: pointer;
      margin-top: 20px;
    }

    button:hover {
      background: #2980b9;
    }

    .result {
      margin-top: 30px;
      padding: 20px;
      border-radius: 10px;
      background: #eef6ff;
      display: none;
    }

    .score {
      font-size: 22px;
      font-weight: bold;
      color: #2c3e50;
    }

    .recommendation {
      margin-top: 10px;
      font-size: 17px;
      line-height: 1.6;
    }

    footer {
      text-align: center;
      margin-top: 20px;
      color: #777;
      font-size: 14px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Depression Expert System</h1>
  <p class="description">
    This expert system evaluates possible signs of depression in IT sector employees based on workplace stress, emotional state, sleep patterns, productivity, and social behavior.
  </p>
  <form id="depressionForm"></form>
  <button onclick="evaluateDepression()">Analyze Mental State</button>
  <div class="result" id="resultBox">
    <div class="score" id="scoreText"></div>
    <div class="recommendation" id="recommendationText"></div>
  </div>
  <footer>
    This tool is for educational purposes only and is not a medical diagnosis system.
  </footer>
</div>

<script>
const questions = [
  "Do you often feel mentally exhausted after work?",
  "Do you struggle to concentrate during coding or meetings?",
  "Do you frequently feel unmotivated at work?",
  "Do you experience sleep problems due to work stress?",
  "Do you feel emotionally drained most days?",
  "Do you avoid interacting with colleagues or friends?",
  "Do deadlines create overwhelming anxiety for you?",
  "Do you feel less productive than before?",
  "Do you frequently experience mood swings?",
  "Do you feel hopeless about your career growth?",
  "Do you work overtime very frequently?",
  "Do you feel isolated while working remotely or in office?",
  "Do you find it difficult to enjoy activities you previously liked?",
  "Do you often overthink mistakes at work?",
  "Do you feel pressure from management affects your mental health?",
  "Do you experience frequent headaches or fatigue?",
  "Do you feel anxious before starting work each day?",
  "Do you have trouble balancing work and personal life?",
  "Do you feel emotionally unsupported at work?",
  "Do you often feel sadness without clear reason?"
];

const form = document.getElementById("depressionForm");
questions.forEach((question, index) => {
  const div = document.createElement("div");
  div.className = "question";
  div.innerHTML = `
    <h3>Q${index + 1}. ${question}</h3>
    <select id="q${index}" required>
      <option value="0">Never</option>
      <option value="1">Rarely</option>
      <option value="2">Sometimes</option>
      <option value="3">Often</option>
      <option value="4">Always</option>
    </select>
  `;

  form.appendChild(div);
});

function evaluateDepression() {
  let totalScore = 0;
  for (let i = 0; i < questions.length; i++) {
    totalScore += parseInt(document.getElementById(`q${i}`).value);
  }
  let level = "";
  let advice = "";
  if (totalScore <= 20) {
    level = "Low Risk of Depression";
    advice = "Your responses indicate relatively healthy emotional well-being. Continue maintaining work-life balance, exercise, and social interaction.";
  }
  else if (totalScore <= 40) {
    level = "Moderate Risk of Depression";
    advice = "You may be experiencing stress and emotional exhaustion. Consider reducing workload pressure, improving sleep habits, and speaking with trusted people.";
  }
  else if (totalScore <= 60) {
    level = "High Risk of Depression";
    advice = "Your responses suggest strong signs of emotional distress and workplace burnout. It is recommended to consult a mental health professional or counselor.";
  }
  else {
    level = "Severe Risk of Depression";
    advice = "Your responses indicate severe emotional strain and possible depression symptoms. Professional psychological support is strongly recommended.";
  }
  document.getElementById("resultBox").style.display = "block";
  document.getElementById("scoreText").innerHTML = `
    Total Score: ${totalScore}/80 <br><br>
    Result: ${level}
  `;
  document.getElementById("recommendationText").innerHTML = advice;
  window.scrollTo({
    top: document.body.scrollHeight,
    behavior: 'smooth'
  });
}
</script>
</body>
</html>
