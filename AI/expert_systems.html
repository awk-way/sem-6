<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Depression Expert System for IT Employees</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>Depression Expert System</h1>
  <p class="description">
    This expert system evaluates possible signs of depression in IT sector employees based on workplace stress, emotional state, sleep patterns, productivity, and social behavior.
  </p>
  <form id="depressionForm"></form>
  <button onclick="evaluateDepression()">Analyze Mental State</button>
  <div class="result" id="resultBox">
    <div class="score" id="scoreText"></div>
    <div class="recommendation" id="recommendationText"></div>
  </div>
  <footer>
    This tool is for educational purposes only and is not a medical diagnosis system.
  </footer>
</div>

<script>
const questions = [
  "Do you often feel mentally exhausted after work?",
  "Do you struggle to concentrate during coding or meetings?",
  "Do you frequently feel unmotivated at work?",
  "Do you experience sleep problems due to work stress?",
  "Do you feel emotionally drained most days?",
  "Do you avoid interacting with colleagues or friends?",
  "Do deadlines create overwhelming anxiety for you?",
  "Do you feel less productive than before?",
  "Do you frequently experience mood swings?",
  "Do you feel hopeless about your career growth?",
  "Do you work overtime very frequently?",
  "Do you feel isolated while working remotely or in office?",
  "Do you find it difficult to enjoy activities you previously liked?",
  "Do you often overthink mistakes at work?",
  "Do you feel pressure from management affects your mental health?",
  "Do you experience frequent headaches or fatigue?",
  "Do you feel anxious before starting work each day?",
  "Do you have trouble balancing work and personal life?",
  "Do you feel emotionally unsupported at work?",
  "Do you often feel sadness without clear reason?"
];

const form = document.getElementById("depressionForm");
questions.forEach((question, index) => {
  const div = document.createElement("div");
  div.className = "question";
  div.innerHTML = `
    <h3>Q${index + 1}. ${question}</h3>
    <select id="q${index}" required>
      <option value="0">Never</option>
      <option value="1">Rarely</option>
      <option value="2">Sometimes</option>
      <option value="3">Often</option>
      <option value="4">Always</option>
    </select>
  `;

  form.appendChild(div);
});

function evaluateDepression() {
  let stressScore = 0;
  let burnoutScore = 0;
  let anxietyScore = 0;
  let depressionScore = 0;
  let detectedSymptoms = [];
  for (let i = 0; i < questions.length; i++) {
    const answer = parseInt(document.getElementById(`q${i}`).value);
    if (answer >= 3) {
      detectedSymptoms.push(questions[i]);
    }
    switch(i){
      // STRESS
      case 0:
      case 3:
      case 6:
      case 10:
      case 14:
      case 17:
        stressScore += answer;
        break;
      // BURNOUT
      case 0:
      case 2:
      case 4:
      case 7:
      case 10:
      case 15:
        burnoutScore += answer;
        break;
      // ANXIETY
      case 3:
      case 6:
      case 8:
      case 13:
      case 16:
      case 19:
        anxietyScore += answer;
        break;
      // DEPRESSION
      case 1:
      case 4:
      case 5:
      case 9:
      case 11:
      case 12:
      case 18:
      case 19:
        depressionScore += answer;
        break;
    }
  }

  function getLevel(score, maxScore) {
    const percentage = (score / maxScore) * 100;
    if (percentage < 20) return "Minimal";
    if (percentage < 40) return "Mild";
    if (percentage < 60) return "Moderate";
    if (percentage < 80) return "High";
    return "Very High";
  }

  const stressLevel = getLevel(stressScore, 24);
  const burnoutLevel = getLevel(burnoutScore, 24);
  const anxietyLevel = getLevel(anxietyScore, 24);
  const depressionLevel = getLevel(depressionScore, 32);
  let overallResult = "";
  const levels = [stressLevel, burnoutLevel, anxietyLevel, depressionLevel];
  if (levels.includes("Very High")) {
      overallResult = "Critical Mental Health Risk";
  }
  else if (levels.includes("High")) {
      overallResult = "High Mental Health Risk";
  }
  else if (levels.includes("Moderate")) {
      overallResult = "Moderate Mental Health Risk";
  }
  else if (levels.includes("Mild")) {
      overallResult = "Mild Mental Health Risk";
  }
  else {
      overallResult = "Minimal Mental Health Risk";
  }
  let symptomHTML = "";
  if(detectedSymptoms.length > 0){
      symptomHTML += "<h3>Frequently Reported Symptoms</h3><ul>";
      detectedSymptoms.forEach(symptom=>{
          symptomHTML += `<li>${symptom}</li>`;
      });
      symptomHTML += "</ul>";
  }
  let recommendation = "";
  if (overallResult === "Minimal Mental Health Risk") {
      recommendation = "The assessment indicates good psychological well-being with minimal signs of stress, burnout, anxiety, or depression. Continue maintaining a healthy work-life balance, regular physical activity, sufficient sleep, and positive social interactions.";
  }
  else if (overallResult === "Mild Mental Health Risk") {
      recommendation = "The assessment suggests early signs of psychological strain. Consider monitoring your stress levels, taking regular breaks during work, maintaining healthy routines, and engaging in activities that promote relaxation and mental well-being.";
  }
  else if (overallResult === "Moderate Mental Health Risk") {
      recommendation = "The assessment indicates noticeable levels of stress, burnout, anxiety, or depressive symptoms. It is advisable to improve workload management, prioritize self-care, seek support from trusted individuals, and consider consulting a mental health professional if symptoms persist.";
  }
  else if (overallResult === "High Mental Health Risk") {
      recommendation = "The assessment suggests significant psychological distress that may be affecting daily functioning, productivity, and emotional well-being. Professional counseling or psychological support is strongly recommended. Reducing excessive workload and improving work-life balance should be prioritized.";
  }
  else {
      recommendation = "The assessment indicates severe psychological distress and a high likelihood of serious mental health concerns. Immediate consultation with a qualified mental health professional is strongly recommended. Early intervention and appropriate support can significantly improve outcomes and overall well-being.";
  }
  document.getElementById("resultBox").style.display = "block";
  document.getElementById("scoreText").innerHTML = `
      <h2>Assessment Results</h2>
      <table style="width:100%; border-collapse: collapse;">
        <tr>
          <th style="text-align:left;">Condition</th>
          <th style="text-align:left;">Score</th>
          <th style="text-align:left;">Level</th>
        </tr>
        <tr>
          <td>Stress</td>
          <td>${stressScore}/24</td>
          <td>${stressLevel}</td>
        </tr>
        <tr>
          <td>Burnout</td>
          <td>${burnoutScore}/24</td>
          <td>${burnoutLevel}</td>
        </tr>
        <tr>
          <td>Anxiety</td>
          <td>${anxietyScore}/24</td>
          <td>${anxietyLevel}</td>
        </tr>
        <tr>
          <td>Depression</td>
          <td>${depressionScore}/32</td>
          <td>${depressionLevel}</td>
        </tr>
      </table>
      <br>
      <b>Overall Assessment:</b> ${overallResult}
  `;
  document.getElementById("recommendationText").innerHTML = `
      <b>Recommendation:</b><br><br>
      ${recommendation}
      <br><br>
      ${symptomHTML}
  `;
  window.scrollTo({
      top: document.body.scrollHeight,
      behavior: 'smooth'
  });
}
</script>
</body>
</html>
